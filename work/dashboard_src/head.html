<title>제주 지형 라이브 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a field-station console. Fixed header strip, the map takes the width, a narrow instrument
   panel on the right (stacks under the map on phones). Colors: cool slate neutrals biased toward the
   accent, one teal accent for controls, reserved status colors for the live-feed state. */
:root{
  --bg:#eef1f3; --panel:#ffffff; --panel-2:#f4f6f8; --fg:#17242b; --muted:#5b6b74; --line:#d3dbe0;
  --accent:#0b7a75; --accent-ink:#ffffff; --accent-soft:#d9efed;
  --ok:#1f7a3a; --ok-soft:#dcf2e3; --warn:#9a5b00; --warn-soft:#fff0cf; --crit:#b3261e; --crit-soft:#fbe0dd; --idle:#5b6b74; --idle-soft:#e4e9ec;
  --sea:#102433; --shadow:0 1px 2px rgba(23,36,43,.08),0 6px 18px rgba(23,36,43,.08);
  --font-ui:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; --font-num:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f171c; --panel:#162027; --panel-2:#1c2830; --fg:#e6edf0; --muted:#95a6ae; --line:#2c3a43;
  --accent:#4cc3bb; --accent-ink:#06211f; --accent-soft:#17403d;
  --ok:#6fd58f; --ok-soft:#153a24; --warn:#f0b34a; --warn-soft:#3f2e0c; --crit:#f08a82; --crit-soft:#4a1b17; --idle:#95a6ae; --idle-soft:#243038;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f171c; --panel:#162027; --panel-2:#1c2830; --fg:#e6edf0; --muted:#95a6ae; --line:#2c3a43;
  --accent:#4cc3bb; --accent-ink:#06211f; --accent-soft:#17403d;
  --ok:#6fd58f; --ok-soft:#153a24; --warn:#f0b34a; --warn-soft:#3f2e0c; --crit:#f08a82; --crit-soft:#4a1b17; --idle:#95a6ae; --idle-soft:#243038;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark }
/*LEAFLET_CSS*/
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
header .sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--idle-soft);color:var(--idle);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
#main{flex:1;display:flex;min-height:0}
#map{flex:1;min-width:0;background:var(--sea);outline:none}
#panel{width:350px;flex:none;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--panel-2);border-radius:8px;padding:8px 10px;min-width:0}
.kpi .v{font:500 20px/1.2 var(--font-num);font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--muted)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
label.chk{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
label.chk input{width:15px;height:15px;accent-color:var(--accent)}
.swatch{width:18px;height:4px;border-radius:2px;flex:none}
.swatch.poly{height:12px;border-radius:3px}
select,input[type=file]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
button.btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.btn:focus-visible,select:focus-visible,input:focus-visible,label.chk:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:12.5px}
.legend .sw{width:26px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.08)}
.ramp{display:flex;height:10px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.ramp span{flex:1}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--font-num)}
.muted{color:var(--muted)}
.small{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11.5px}
td.n,th.n{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
tbody tr.sel{background:var(--accent-soft)}
.tablewrap{overflow-x:auto;max-height:260px;overflow-y:auto}
dl.sel{display:grid;grid-template-columns:minmax(72px,max-content) minmax(0,1fr);gap:3px 10px;margin:0;font-size:12.5px}
dl.sel dt{color:var(--muted);white-space:nowrap}dl.sel dd{margin:0;font-family:var(--font-num);min-width:0;overflow-wrap:anywhere}
.status-line{overflow-wrap:anywhere;max-width:420px}
.status-line{font-size:12.5px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.leaflet-container{font:12px var(--font-ui);background:var(--sea)}
.leaflet-tooltip.lbl{background:rgba(122,29,76,.85);color:#fff;border:0;border-radius:4px;padding:1px 5px;font:500 11px var(--font-num);box-shadow:none}
.leaflet-tooltip.lbl::before{display:none}
.leaflet-tooltip.lbl.trail{background:rgba(0,112,104,.85)}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--fg);border-radius:8px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-control-zoom a{background:var(--panel);color:var(--fg);border-bottom-color:var(--line)}
.leaflet-control-attribution{background:rgba(255,255,255,.75);color:#17242b;font-size:10px}
.credit{font-size:11px;color:var(--muted);line-height:1.4}
#hint{position:absolute;left:12px;bottom:12px;z-index:500;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
@media (max-width:860px){
  #main{flex-direction:column;overflow:auto}
  #map{flex:none;height:58vh;min-height:320px}
  #panel{width:auto;border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
